name: Infra - destroy

# Boton manual: Actions > "Infra - destroy" > Run workflow (escribe "destroy")
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para confirmar'
        required: true
      instance_profile_name:
        description: "El mismo valor que usaste en el apply"
        required: false
        default: "LabInstanceProfile"

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_instance_profile_name: ${{ inputs.instance_profile_name }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirmacion
        if: inputs.confirm != 'destroy'
        run: |
          echo "::error::Para destruir escribe exactamente: destroy"
          exit 1

      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validar credenciales de AWS
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::Las credenciales de AWS no funcionan. Actualiza los secrets de AWS."
            exit 1
          fi

      - name: Llave publica SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Terraform pide la variable aunque para destruir no importa su valor
          if [ -n "$EC2_SSH_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "TF_VAR_ssh_public_key=$(ssh-keygen -y -f ~/.ssh/id_ed25519)" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_ssh_public_key=unused" >> "$GITHUB_ENV"
          fi

      - name: Buscar el bucket del tfstate
        id: state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="tfstate-to-do-list-api-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existe $BUCKET: no hay infraestructura que destruir." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: terraform init
        if: steps.state.outputs.exists == 'true'
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: terraform destroy
        if: steps.state.outputs.exists == 'true'
        run: terraform destroy -auto-approve

      - name: Resumen
        if: steps.state.outputs.exists == 'true'
        run: |
          {
            echo "## Infraestructura destruida"
            echo ""
            echo "El bucket \`$TF_STATE_BUCKET\` se conserva con el tfstate vacio."
            echo "Cuando vuelvas a correr **Infra - apply**, actualiza el secret \`EC2_HOST\` con la IP nueva."
          } >> "$GITHUB_STEP_SUMMARY"
