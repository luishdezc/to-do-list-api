name: Deploy

# Continuous Deployment: descarga el zip del release en la EC2 y reinicia la app.
on:
  # Lo llama el workflow Release al terminar de publicar
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Releases creados a mano desde la pagina de GitHub
  release:
    types: [published]
  # Re-desplegar una version a mano (p. ej. despues de recrear la infra)
  workflow_dispatch:
    inputs:
      tag:
        description: "Version a desplegar (ej. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Validar datos
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Version invalida: '$TAG'"; exit 1
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "::error::Falta el secret EC2_HOST. Corre 'Infra - apply' y guarda la IP de la EC2."; exit 1
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Falta el secret EC2_SSH_KEY."; exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Descargar el release en la EC2 y reiniciar
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "ec2-user@${EC2_HOST}" \
            "sudo bash -s -- '${GITHUB_REPOSITORY}' '${TAG}'" < scripts/deploy.sh

      - name: Verificar /version
        run: |
          GOT=""
          for _ in $(seq 1 12); do
            GOT=$(curl -fsS --max-time 5 "http://${EC2_HOST}:5000/version" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)
            if [ "$GOT" = "$TAG" ]; then
              echo "OK: /version = $GOT"
              {
                echo "## Desplegado $TAG"
                echo ""
                echo "- http://${EC2_HOST}:5000/version"
                echo "- http://${EC2_HOST}:5000/tasks"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/version responde '$GOT' y se esperaba '$TAG'"
          exit 1
